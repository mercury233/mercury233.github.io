<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WindBot deck codes from YGOPro deck file</title>
	<style>
		body,
		html {
			margin: 0;
			padding: 0;
			height: 100%;
		}

		.container {
			height: 100%;
			display: flex;
			flex-direction: column;
		}

		.top {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 10px;
			box-sizing: border-box;
			background-color: #f0f0f0;
		}

		.top button {
			padding: 10px;
			flex: 0 0 auto;
			width: 120px;
			margin-left: 10px;
		}

		.top div {
			flex: 1;
			display: flex;
			justify-content: space-between;
			margin-left: 10px;
		}

		.top input {
			flex: 1;
			width: auto;
			margin-left: 10px;
		}

		.top .checkboxContainer {
			flex: 0 0 auto;
			width: auto;
			margin-left: 0;
		}

		.bottom {
			display: flex;
			height: 100%;
		}

		.left,
		.right {
			box-sizing: border-box;
			padding: 10px;
			position: relative;
		}

		.left {
			flex: 0 0 30%;
		}

		.right {
			flex: 1;
		}

		.input {
			width: 100%;
			height: 100%;
			box-sizing: border-box;
		}

		.loading .input {
			background-color: #f0f0f0;
			color: #999;
			cursor: wait;
		}

		.left.dragover .input {
			background-color: #e8f5e9;
			border-color: #4caf50;
		}

		#progressBarContainer {
			width: 100%;
			display: block;
			margin-left: 0;
			margin-right: 20px;
		}

		#progressBar {
			height: 20px;
			width: 0%;
			background-color: #4caf50;
			background-size: 200% 100%;
			border-radius: 5px;
		}

		.loading #progressBar {
			background-image: linear-gradient(-45deg, #4caf50, #cbddb7, #4caf50);
			animation: progressBarAnimation 2s linear infinite;
		}

		@keyframes progressBarAnimation {
			0% {
				background-position: 100% 0;
			}

			100% {
				background-position: -100% 0;
			}
		}

		.floatButton {
			position: absolute;
			top: 15px;
			right: 15px;
			padding: 5px 10px;
			background-color: #4caf5099;
			color: white;
			border: none;
			border-radius: 3px;
			cursor: pointer;
		}

		.floatButton:hover {
			background-color: #4caf50;
		}

		.outputButtons {
			position: absolute;
			top: 15px;
			right: 15px;
			display: flex;
			gap: 5px;
		}

		.outputButtons .floatButton {
			position: static;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="top">
			<div>
				<label for="deckName">Name: </label>
				<input type="text" id="deckName" class="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Abcd">
			</div>
			<div>
				<label for="deckFile">Deck File: </label>
				<input type="text" id="deckFile" class="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="AI_Abcd">
			</div>
			<button id="generate">Generate</button>
			<div class="checkboxContainer">
				<input type="checkbox" id="chineseHint" checked>
				<label for="chineseHint" title="Add Chinese card names as comment.">中文注释</label>
			</div>
			<div class="checkboxContainer">
				<input type="checkbox" id="underscore">
				<label for="underscore" title="Replace spaces with underscores.">Underscore</label>
			</div>
			<div id="progressBarContainer">
				<div id="progressBar"></div>
			</div>
		</div>
		<div class="bottom">
			<div class="left">
				<button id="helpButton" class="floatButton">?</button>
				<textarea class="input" id="deckText" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="# paste or drop your .ydk file here
#main
18144506
89631139
46986414"></textarea>
			</div>
			<div class="right">
				<div class="outputButtons">
					<button id="downloadButton" class="floatButton">Download</button>
					<button id="copyButton" class="floatButton">Copy</button>
				</div>
				<textarea class="input" id="output" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="using System;
using WindBot;

// here will be the generated code
"></textarea>
			</div>
		</div>
	</div>

	<script>
		function createIdentifier(name, underscore, fallback, numericPrefix = 'Card') {
			const words = name.normalize('NFKD')
				.replace(/[\u0300-\u036f]/g, '')
				.replace(/['’]/g, '')
				.replace(/[^A-Za-z0-9]+/g, ' ')
				.trim()
				.split(/\s+/)
				.filter(Boolean);
			let identifier = underscore
				? words.join('_')
				: words.map(word => word.charAt(0).toUpperCase() + word.slice(1)).join('');
			if (!identifier) {
				identifier = fallback;
			}
			if (/^\d/.test(identifier)) {
				identifier = `${numericPrefix}${underscore ? '_' : ''}${identifier}`;
			}
			return identifier;
		}

		function escapeCSharpString(value) {
			return value.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
		}

		async function generate() {
			const deckName = document.getElementById('deckName').value || 'Abcd';
			const deckFile = document.getElementById('deckFile').value || 'AI_Abcd';
			const deckText = document.getElementById('deckText').value || '18144506\n89631139\n46986414';
			const underscore = document.getElementById('underscore').checked;
			const progressBar = document.getElementById('progressBar');
			const cardIds = [...new Set(deckText
				.split(/\r?\n/)
				.map(line => line.trim())
				.filter(line => /^\d+$/.test(line) && Number(line) !== 0)
				.map(Number))];

			progressBar.style.width = '0%';
			document.body.classList.add('loading');
			try {
				if (cardIds.length === 0) {
					throw new Error('No card IDs were found in the deck.');
				}
				if (cardIds.length > 100) {
					throw new Error('The deck contains more than 100 different card IDs.');
				}

				progressBar.style.width = '25%';
				const response = await fetch('https://ygocdb.com/api/v0/cardset', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ ids: cardIds })
				});
				if (!response.ok) {
					throw new Error(`Card API returned HTTP ${response.status}.`);
				}
				const data = await response.json();
				const usedNames = new Set();
				const resultCards = [];
				for (const cardId of cardIds) {
					const card = data[String(cardId)];
					if (!card) {
						console.warn('No card found for ' + cardId);
						continue;
					}
					const name = card.text.en_name || card.text.wiki_en || `Unknown ${cardId}`;
					const baseName = createIdentifier(name, underscore, `Unknown${cardId}`);
					const varName = usedNames.has(baseName) ? `${baseName}_${cardId}` : baseName;
					usedNames.add(varName);
					resultCards.push({ id: cardId, data: card, varName });
				}
				if (resultCards.length === 0) {
					throw new Error('The card API did not return any matching cards.');
				}

				progressBar.style.width = '75%';
				updateOutput(deckName, deckFile, resultCards);
				progressBar.style.width = '100%';
			} catch (error) {
				progressBar.style.width = '0%';
				console.error(error);
				alert(error.message);
			} finally {
				document.body.classList.remove('loading');
			}
		}

		document.getElementById('generate').addEventListener('click', generate);

		function updateOutput(deckName, deckFile, resultCards) {
			let chineseHint = document.getElementById('chineseHint').checked;
			let cardIdCodes = resultCards.map(x => {
				let c = `            public const int ${x.varName} = ${x.id};`
				if (chineseHint && x.data.cn_name) {
					c += ` // ${x.data.cn_name}`;
				}
				return c;
			}).join('\n');
			let sampleCardName = resultCards[0].varName;
			let output = document.getElementById('output');
			let executorName = createIdentifier(deckName, false, 'Abcd', 'Deck');
			output.value =
				`using System;
using System.Collections.Generic;
using System.Linq;
using YGOSharp.OCGWrapper.Enums;
using WindBot;
using WindBot.Game;
using WindBot.Game.AI;

namespace WindBot.Game.AI.Decks
{
    [Deck("${escapeCSharpString(deckName)}", "${escapeCSharpString(deckFile)}")]
    class ${executorName}Executor : DefaultExecutor
    {
        public class CardId
        {
${cardIdCodes}
        }

        public ${executorName}Executor(GameAI ai, Duel duel)
            : base(ai, duel)
        {
            AddExecutor(ExecutorType.Activate, CardId.${sampleCardName}, ${sampleCardName}Activate);
            // Add other executors here
        }

        private bool mybool = false; // this is a sample variable

        public override bool OnSelectHand()
        {
            // go first
            return true;
        }

        public override void OnNewTurn()
        {
            mybool = false;
            base.OnNewTurn();
        }

        private bool ${sampleCardName}Activate()
        {
            // your code here
            mybool = true;
            return true;
        }

        // Add other functions here
    }
}
`;
		}

		const dropTarget = document.querySelector('.left');
		document.addEventListener('dragover', event => event.preventDefault());
		document.addEventListener('drop', event => event.preventDefault());
		for (const eventName of ['dragenter', 'dragover']) {
			dropTarget.addEventListener(eventName, event => {
				event.preventDefault();
				event.dataTransfer.dropEffect = 'copy';
				dropTarget.classList.add('dragover');
			});
		}
		dropTarget.addEventListener('dragleave', () => dropTarget.classList.remove('dragover'));
		dropTarget.addEventListener('drop', async event => {
			event.preventDefault();
			dropTarget.classList.remove('dragover');
			const file = event.dataTransfer.files[0];
			if (!file || !/\.ydk$/i.test(file.name)) {
				alert('Please drop a .ydk deck file.');
				return;
			}
			const baseName = file.name.replace(/\.ydk$/i, '');
			const deckName = baseName.replace(/^AI_/i, '') || 'Abcd';
			document.getElementById('deckText').value = await file.text();
			document.getElementById('deckName').value = deckName;
			document.getElementById('deckFile').value = `AI_${deckName}`;
			generate();
		});

		document.getElementById('copyButton').addEventListener('click', function () {
			const output = document.getElementById('output');
			output.select();
			document.execCommand('copy');

			const originalText = this.textContent;
			this.textContent = 'Copied!';
			setTimeout(() => {
				this.textContent = originalText;
			}, 1500);
		});

		document.getElementById('downloadButton').addEventListener('click', function () {
			const output = document.getElementById('output');
			if (!output.value) {
				alert('Generate the executor before downloading it.');
				return;
			}
			const executorName = createIdentifier(document.getElementById('deckName').value || 'Abcd', false, 'Abcd', 'Deck');
			const url = URL.createObjectURL(new Blob([output.value], { type: 'text/plain;charset=utf-8' }));
			const link = document.createElement('a');
			link.href = url;
			link.download = `${executorName}Executor.cs`;
			document.body.appendChild(link);
			link.click();
			link.remove();
			URL.revokeObjectURL(url);
		});

		document.getElementById('helpButton').addEventListener('click', function () {
			alert(`This tool generates a WindBot deck code from a YGOPro deck file.
Paste the deck contents into the left textarea, or drop a .ydk file onto it.`);
		});
	</script>
</body>

</html>
